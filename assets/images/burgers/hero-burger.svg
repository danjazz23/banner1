  <!-- Lettuce -->
  <path d="M60 140 Q100 130 150 145 Q200 135 250 145 Q300 130 340 145 L340 155 Q300 140 250 155 Q200 145 150 155 Q100 140 60 155 Z" fill="#4CAF50"/>
